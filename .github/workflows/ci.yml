name: CI

# 最小 CI 骨架：
#   scope         —— make test-critical-scope（RULES.md §8），判断本 PR 是否必须跑 test-critical
#   workflow      —— 工作流自身的测试：skill 脚本 + 路径分类脚本 + 计划目录审计 + workflow 语法
#   test-critical —— scope 判定 REQUIRED 时运行；Makefile 的 TEST_CRITICAL_CMD 未配置时只给警告
# 按项目追加构建、lint、客户端检查等 job；本地规则（RULES.md §8）不因 CI 绿而豁免。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: make test-critical-scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          set +e
          bash .github/scripts/test-critical-scope.sh "$(git merge-base "origin/$BASE_REF" HEAD)"
          code=$?
          set -e
          case "$code" in
            0) echo "required=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "required=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::test-critical-scope failed (exit $code)"; exit "$code" ;;
          esac

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml
      - name: Skill script and CI scope tests
        run: make test-workflow PYTHON=python
      - name: docs/plans structure and link audit
        run: make audit-plans PYTHON=python
      - name: Workflow files parse
        run: |
          for f in .github/workflows/*.yml; do
            python -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
            echo "ok $f"
          done
      - name: shellcheck (errors only)
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

  test-critical:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test-critical
        run: |
          if ! grep -qE '^TEST_CRITICAL_CMD[[:space:]]*\?=[[:space:]]*[^[:space:]]' Makefile; then
            echo "::warning::TEST_CRITICAL_CMD is not configured in the Makefile; test-critical skipped. Fill it in (RULES.md §8) and add the project's runtime setup to this job."
            exit 0
          fi
          make test-critical
